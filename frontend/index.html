<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智膳 · 餐饮管理后台</title>
  <!-- 防闪烁：在样式应用前就定好主题 -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('theme_mode') || 'auto';
        var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/app.css" />
  <script src="js/echarts.min.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <aside class="auth-hero">
      <div class="brand">
        <span class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Zm11 1h3a2 2 0 0 1 0 5h-3M8 3v2M11 3v2"/></svg>
        </span>
        <span>智膳</span>
      </div>

      <div>
        <h1>把每一道菜<br/>都交还给懂它的人</h1>
        <p>智膳是一套以菜品知识为核心的餐饮经营系统——从点餐、库存到经营分析，让数据替你记住味道。</p>
        <div class="feat">
          <div class="f"><span class="dot"></span>菜品知识库驱动</div>
          <div class="f"><span class="dot"></span>经营数据可视化</div>
          <div class="f"><span class="dot"></span>AI 助手随时问答</div>
        </div>
        <div class="auth-deco">
          <div class="d"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8Zm4 0c.8 1.6 2 2.4 5 2.4S16.2 12.6 17 11"/></svg></div>
          <div class="d"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
          <div class="d"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v2h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h2V6a3 3 0 0 1 3-3Zm-4 9v2M16 12v2"/></svg></div>
        </div>
      </div>

      <div class="foot">© 智膳 · 让经营回归味道本身</div>
    </aside>

    <main class="auth-card">
      <button class="theme-toggle" data-theme-toggle aria-label="切换主题"></button>
      <div class="auth-box" id="authBox">
        <!-- 登录 / 注册由 app.js 渲染 -->
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
