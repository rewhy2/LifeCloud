<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智膳 · 在线点餐</title>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('theme_mode') || 'auto';
        var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="user-shell">
    <header class="user-top">
      <div class="u-brand">
        <span class="logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V8Zm11 1h3a2 2 0 0 1 0 5h-3M8 3v2M11 3v2"/></svg>
        </span>
        <span>智膳</span>
      </div>
      <nav class="u-nav">
        <a class="u-link" id="navDash" href="#/dashboard">首页</a>
        <a class="u-link" id="navMenu" href="#/menu">点餐</a>
        <a class="u-link" id="navOrders" href="#/orders">订单</a>
        <a class="u-link" id="navChat" href="#/chat">问问 AI</a>
      </nav>
      <div class="spacer"></div>
      <span class="u-pill" id="logout" title="退出登录" style="cursor:pointer">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 12H3M6 8l-4 4 4 4"/></svg>
        <span>退出</span>
      </span>
      <div class="u-pill" id="themeBtn" data-theme-toggle>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 0c2.5 2.5 3.5 6 0 9-3.5-3-2.5-6.5 0-9Z"/></svg>
        <span class="theme-label">主题</span>
      </div>
    </header>

    <main class="page" id="view"></main>
  </div>

  <!-- 悬浮购物车 -->
  <div class="cart-fab" id="cartFab" style="display:none">
    <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2Zm9 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"/></svg>
    <span class="badge-count" id="cartCount">0</span>
  </div>

  <script type="module" src="js/user-app.js"></script>
</body>
</html>
