server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: "optional:nacos:gateway-service.yml"
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: RESTAURANT
        ip: 127.0.0.1
        preferred-networks: 127.0.0.1
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: RESTAURANT
        file-extension: yml
        refresh-enabled: true
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # 鉴权 / 用户管理
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/admin/users/**
          filters:
            - StripPrefix=0
        # 交易域：商品/分类/订单/桌台/优惠券/营业/顾客端
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/api/products/**, /api/categories/**, /api/orders/**, /api/tables/**, /api/coupons/**, /api/business/**, /api/user/**
          filters:
            - StripPrefix=0
        # 运营域：会员/库存/采购/供应商/员工/排班/报表
        - id: ops-service
          uri: lb://ops-service
          predicates:
            - Path=/api/members/**, /api/inventory/**, /api/purchases/**, /api/suppliers/**, /api/employees/**, /api/schedules/**, /api/report/**
          filters:
            - StripPrefix=0
        # AI 智能助手
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.zhixiang.gateway: DEBUG
